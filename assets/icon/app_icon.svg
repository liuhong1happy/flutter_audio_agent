<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26a69a"/>
      <stop offset="1" stop-color="#004d40"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b2dfdb"/>
    </linearGradient>
  </defs>
  <!-- 圆角方形背景 -->
  <rect x="40" y="40" width="944" height="944" rx="216" fill="url(#bg)"/>
  <!-- 顶部小圆点装饰(对话气泡感) -->
  <circle cx="512" cy="176" r="22" fill="#ffffff" opacity="0.55"/>

  <!-- 声波(音量柱) -->
  <g fill="url(#bar)">
    <rect x="352" y="470" width="60" height="150" rx="30"/>
    <rect x="450" y="384" width="60" height="322" rx="30"/>
    <rect x="548" y="296" width="60" height="498" rx="30"/>
    <rect x="646" y="384" width="60" height="322" rx="30"/>
  </g>

  <!-- 底部横向细条(底座) -->
  <rect x="352" y="838" width="354" height="18" rx="9" fill="#ffffff" opacity="0.7"/>

  <!-- TTS 文案 -->
  <text x="512" y="742" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="168" font-weight="bold" fill="#ffffff"
        letter-spacing="6">TTS</text>
</svg>
