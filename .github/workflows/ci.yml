# CI:静态分析 + 单元/Widget 测试。
# Patrol 集成测试与打 tag 自动打包待接入(需模拟器/签名)。
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit & widget tests
        run: flutter test
